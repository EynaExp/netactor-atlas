version: '3.8'

services:
  toolbox:
    build:
      context: .
      dockerfile: Dockerfile.toolbox
    container_name: netactor-toolbox
    restart: unless-stopped
    network_mode: host
    volumes:
      - toolbox-data:/tools
      - toolbox-reports:/reports
    env_file:
      - deploy/.env

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: netactor-app
    restart: unless-stopped
    network_mode: host
    depends_on:
      - toolbox
    volumes:
      - app-data:/app/data
      - app-reports:/reports
    env_file:
      - deploy/.env

volumes:
  toolbox-data:
  toolbox-reports:
  app-data:
  app-reports: